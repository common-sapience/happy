name: Desktop packages

# Manual only: the packages are produced on request, and the harness decides which
# engine commit ships by passing it in (its submodule pointer is the authority).
on:
  workflow_dispatch:
    inputs:
      engine_ref:
        description: Engine fork ref to build the engine sidecar from
        required: false
        default: harness/m2
      server_url:
        description: Relay URL baked into the package (empty ships a package that asks on first launch)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x86_64
          - os: macos-latest
            label: macos-aarch64
          - os: windows-latest
            label: windows-x86_64
    steps:
      - name: Checkout control plane
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: common-sapience/opencode
          ref: ${{ inputs.engine_ref || 'harness/m2' }}
          path: engine

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # 22, not 20: the engine's dependencies build native addons with
          # node-gyp, whose current release needs a Node this new.
          node-version: 22
          cache: pnpm

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage daemon and engine sidecars
        working-directory: packages/happy-app
        run: node scripts/stage-sidecars.mjs --engine-repo ../../engine

      # Unsigned on every platform: no certificates are configured here. macOS
      # needs right-click-open or `xattr -d com.apple.quarantine <app>` on first
      # launch, Windows shows a SmartScreen warning.
      - name: Build desktop package
        uses: tauri-apps/tauri-action@e834788a94591d81e3ae0bd9ec06366f5afb8994 # v0.5.23
        env:
          EXPO_PUBLIC_HAPPY_SERVER_URL: ${{ inputs.server_url }}
          HAPPY_SERVER_URL: ${{ inputs.server_url }}
        with:
          projectPath: packages/happy-app

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: happy-desktop-${{ matrix.label }}
          if-no-files-found: error
          path: |
            packages/happy-app/src-tauri/target/release/bundle/deb/*.deb
            packages/happy-app/src-tauri/target/release/bundle/appimage/*.AppImage
            packages/happy-app/src-tauri/target/release/bundle/rpm/*.rpm
            packages/happy-app/src-tauri/target/release/bundle/dmg/*.dmg
            packages/happy-app/src-tauri/target/release/bundle/macos/*.app.tar.gz
            packages/happy-app/src-tauri/target/release/bundle/nsis/*.exe
            packages/happy-app/src-tauri/target/release/bundle/msi/*.msi
